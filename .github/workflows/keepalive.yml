# Ping the Django health endpoint so at least one Vercel instance stays warm.
# GitHub Actions will not run more often than every 5 minutes (a 4-minute
# cron is silently ignored). Hobby functions typically idle after ~5 minutes.
name: Keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keepalive.yml"

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /api/health/
        run: |
          curl -fsS --max-time 30 \
            -o /tmp/health.json \
            -w "http_code=%{http_code} time=%{time_total}s\n" \
            "https://recommendation-backend-ten.vercel.app/api/health/"
          cat /tmp/health.json
          echo
          grep -q '"ok": true' /tmp/health.json
